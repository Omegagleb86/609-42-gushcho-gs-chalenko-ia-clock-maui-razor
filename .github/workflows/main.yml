name: Build Windows MAUI

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore clock.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifierOverride=win-x64 -p:PublishReadyToRun=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Windows application
        shell: pwsh
        run: |
          dotnet publish clock.csproj -f net10.0-windows10.0.19041.0 -c Release -p:RuntimeIdentifierOverride=win-x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=false -p:PublishReadyToRun=false --no-restore -o ./publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clock-Windows
          path: ./publish/
          if-no-files-found: error
